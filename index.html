<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A private ledger of everything you have run, lifted, swum and walked.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Activity Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239E77ED' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='13.5' cy='3.75' r='1.75'/><path d='M9 22l2.2-5.4L8.4 14a2 2 0 0 1-.6-1.9l.9-4.3a2 2 0 0 1 3.2-1.2l2.6 2.1a4 4 0 0 0 2.1.9l1.8.2'/><path d='M11.2 12.4 7 13.6a2 2 0 0 0-1.3 1.2L4 19'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- The href keeps this a real link for assistive technology, but the hash belongs
     to the router: letting it through would change the route rather than the focus. -->
<a href="#view-host" class="skip-link"
   onclick="event.preventDefault(); document.getElementById('view-host').focus();"
   >Skip to content</a>

<header class="app-header">
  <h1 class="app-title"><span class="app-mark" id="app-mark"></span>Activity Ledger</h1>
</header>

<main id="view-host" class="view-host" tabindex="-1"><!-- the active view renders here --></main>

<nav id="main-nav" class="main-nav" aria-label="Main"><!-- built from the view registry --></nav>

<div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>
<div id="dialog-host"></div>

<!-- No build step: plain scripts, loaded in dependency order.
     config → helpers → storage → UI primitives → views → boot. -->
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/dates.js"></script>
<script src="js/metrics.js"></script>
<script src="js/activity-types.js"></script>
<script src="js/records.js"></script>
<script src="js/db.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/routing.js"></script>
<script src="js/dedupe/rules.js"></script>
<script src="js/dedupe/sessions.js"></script>
<script src="js/dedupe/streams.js"></script>
<script src="js/dedupe/engine.js"></script>
<script src="js/rollups.js"></script>
<script src="js/equivalences.js"></script>
<script src="js/streaks.js"></script>
<script src="js/goals.js"></script>
<script src="js/charts.js"></script>
<script src="js/insights.js"></script>
<script src="js/targets.js"></script>
<script src="js/import/zip.js"></script>
<script src="js/import/csv.js"></script>
<script src="js/import/normalize.js"></script>
<script src="js/import/xml-stream.js"></script>
<script src="js/import/apple-health.js"></script>
<script src="js/import/fitbit-parse.js"></script>
<script src="js/import/fitbit-takeout.js"></script>
<script src="js/import/sniffer.js"></script>
<script src="js/import/inspector.js"></script>
<script src="js/backup.js"></script>
<script src="js/import/importer.js"></script>
<!-- View registration order sets the order of the tab bar. -->
<script src="js/sync/google-health.js"></script>
<script src="js/sync/google-probe.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/targets-ui.js"></script>
<script src="js/insights-ui.js"></script>
<script src="js/year-review.js"></script>
<script src="js/metric-detail.js"></script>
<script src="js/diagnose.js"></script>
<script src="js/recent-ui.js"></script>
<script src="js/import/import-ui.js"></script>
<script src="js/dedupe/review-ui.js"></script>
<script src="js/settings.js"></script>
<script src="js/motion.js"></script>
<script src="js/pwa-init.js"></script>
<script src="js/app.js"></script>
</body>
</html>

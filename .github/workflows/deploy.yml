# Publishes the app to GitHub Pages after its tests pass.
#
# ONE-TIME SETUP, REQUIRED: enable Pages under
#   Settings → Pages → Source: "GitHub Actions"
#
# This cannot be automated. The workflow does ask configure-pages to create the site
# (enablement: true below), but the default GITHUB_TOKEN is not permitted to:
#   Create Pages site failed. Error: Resource not accessible by integration
# Creating a Pages site needs administration rights, which a workflow token does not
# get. Once a repository admin has enabled it, every deploy after that is automatic —
# the enablement flag then finds the site already there and does nothing.
name: Deploy

on:
  push:
    # The repository's default branch. `main` is listed too so this keeps working if
    # the branch is ever renamed or merged into one.
    branches: [claude/upbeat-archimedes-evouv5, main]
  workflow_dispatch:

# Pages deployment needs an OIDC token to prove the workflow is allowed to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead. In-progress runs are not cancelled,
# so a half-finished deploy cannot leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Deploying a broken build is worse than not deploying, so the same checks CI
      # runs gate the publish.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Set this repository variable to publish to your own domain instead of
          # the github.io address; it writes the CNAME file the DNS setup needs.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI smoke test (built output)
        run: npm run test:ui:build

      # Kept so this self-heals if the token ever gains the rights; today it fails
      # over to the manual step described at the top of this file.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

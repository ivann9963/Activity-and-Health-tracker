# Cloudflare Worker configuration.
#
# This is a Worker with static assets rather than a Pages project: Cloudflare's
# current dashboard creates Workers, and Pages is no longer the path new projects
# are steered down. The practical difference is that routing is explicit —
# worker.js decides what is an API call and what is a file — instead of being
# inferred from a functions/ directory.
#
# Build command in the dashboard:   npm run build
# Deploy command in the dashboard:  npx wrangler deploy
#
# Two values must be set on the Worker, under Settings → Variables and Secrets, each
# with its type set to "Secret" rather than "Variable":
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#
# The type is load-bearing and gets this wrong once per person. `wrangler deploy`
# treats this file as the truth for plaintext `vars`: anything added in the dashboard
# as a Variable, and not declared here, is REMOVED by the next deploy. So a Variable
# works, survives a while, and then vanishes the next time anything ships — which
# reads as "Cloudflare keeps losing my config" rather than as what it is. Secrets are
# stored separately and no deploy touches them.
#
# (GOOGLE_CLIENT_ID is not, strictly, a secret — an OAuth client id travels in the
# authorisation URL and is visible to anyone using the app. It could equally be
# declared in a `[vars]` block here. It is kept as a Secret so that neither value
# lives in the repository, and so both are set the same way.)

name = "activity-and-health-tracker"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
# `npm run build` writes here. Requests that match a file are served directly and
# never reach the Worker; anything else — /api/... — falls through to it. That is the
# default behaviour, so no extra routing rules are needed.
directory = "_site"
binding = "ASSETS"
